[package]
name = "xmip-core-transport-unix-socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-unix-socket"
description = "Unix domain socket transport: one connection to a socket on the file system is one Stream, on the operating systems that have one. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`), on every operating system: a
# Location's settings are suggested where the socket is not there too.
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# A filesystem path as the path of a URI, written once for the estate, and
# a connection read to its end under the ceiling (`net::read::to_end`).
net = { workspace = true, optional = true }

# The peer's credentials as the kernel reports them, `SO_PEERCRED`, behind
# rustix's safe call: the standard library's `peer_cred` is not stable, and
# this crate writes no unsafe. Linux and Android hold them in a `ucred`.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "net"], optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:context", "dep:net", "dep:rustix"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
